<title>Plano 3D Domótica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: dashboard a pantalla completa. Pestañas de ambientes arriba, escena 3D al centro,
   controles abajo y un cajón lateral con la lista de equipos. Estética "noche azul" única. */
:root {
  --bg: #0a1430;
  --glass: rgba(16, 30, 68, .72);
  --glass-strong: rgba(13, 25, 58, .94);
  --fg: #eaf0fd;
  --muted: #94a5cb;
  --line: rgba(150, 180, 255, .16);
  --chip: rgba(255, 255, 255, .07);
  --warm: #ffb24a;          /* luz encendida */
  --warm-soft: rgba(255, 178, 74, .18);
  --sky: #82b8ff;           /* acento frío: selección, sensores */
  --ok: #5fd3a0;
  --alert: #ff6b62;
  --shadow: 0 12px 34px rgba(0, 6, 25, .5);
  --f-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); overflow: hidden; }
#app { position: relative; height: 100%; }
#stage { position: absolute; inset: 0; overflow: hidden; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#markers { position: absolute; inset: 0; pointer-events: none; }
.glass { background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

/* Pestañas de ambientes */
.tabs { position: absolute; top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 2px; padding: 4px; border-radius: 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; display: inline-flex; align-items: center; gap: 7px; font: 600 13px var(--f-body); color: var(--muted); background: none; border: 0; padding: 8px 12px; border-radius: 10px; cursor: pointer; position: relative; white-space: nowrap; }
.tab svg { width: 16px; height: 16px; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); background: var(--chip); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 2px; height: 2px; border-radius: 2px; background: var(--sky); }
.tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warm); box-shadow: 0 0 8px var(--warm); }
.tab .dot[hidden] { display: none; }

/* Controles inferiores */
.toolbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100% - 24px); }
.seg { display: inline-flex; border-radius: 12px; padding: 3px; }
.seg button, .btn { font: 600 12.5px var(--f-body); color: var(--muted); background: none; border: 0; padding: 7px 12px; border-radius: 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: rgba(130, 184, 255, .2); color: var(--fg); }
.btn { border-radius: 12px; color: var(--fg); padding: 10px 14px; }
.btn svg { width: 15px; height: 15px; }
.btn[aria-pressed="true"] { background: rgba(130, 184, 255, .24); }
button:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }

.coords { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font: 500 11.5px var(--f-mono); color: var(--fg); border-radius: 10px; padding: 7px 10px; font-variant-numeric: tabular-nums; }
.coords span { color: var(--muted); }

/* Botón redondo por ambiente (como en el dashboard de referencia) */
.room-btn { position: absolute; left: 0; top: 0; display: grid; justify-items: center; gap: 5px; pointer-events: none; }
.room-btn button { pointer-events: auto; width: 46px; height: 46px; margin-top: -23px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--fg); background: rgba(20, 34, 72, .55); border: 1.5px solid rgba(255, 255, 255, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 4px 14px rgba(0, 0, 0, .35); transition: background .25s, border-color .25s, transform .15s, box-shadow .25s; }
.room-btn button:hover { transform: scale(1.07); }
.room-btn button svg { width: 20px; height: 20px; }
.room-btn.on button { background: rgba(255, 178, 74, .85); border-color: #ffe2b5; color: #3b2304; box-shadow: 0 0 22px rgba(255, 178, 74, .65); }
.room-btn span { font: 700 10.5px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 4px rgba(0, 0, 0, .8); white-space: nowrap; }

/* Marcadores de equipos (se muestran con "Equipos") */
.marker { position: absolute; left: 0; top: 0; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.8); background: #5a6b92; color: #fff; display: none; place-items: center; cursor: pointer; pointer-events: auto; box-shadow: 0 2px 8px rgba(0,0,0,.4); padding: 0; transition: background .2s; }
.show-devs .marker { display: grid; }
.show-devs .room-btn { display: none; }
.marker svg { width: 13px; height: 13px; }
.marker:hover { z-index: 2; }
.marker[data-k="on"] { background: var(--warm); color: #3b2304; }
.marker[data-k="sensor"] { background: #3d73c9; }
.marker[data-k="alert"] { background: var(--alert); animation: pulse 1s infinite; }
.marker[data-k="ok"] { background: #2f8f6a; }
.marker .tip { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 600 11.5px var(--f-body); background: var(--glass-strong); color: var(--fg); padding: 4px 8px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .15s; }
.marker:hover .tip, .marker:focus-visible .tip { opacity: 1; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(255,107,98,.25); } }
@media (prefers-reduced-motion: reduce) { .marker[data-k="alert"] { animation: none; } }

/* Cajón de equipos */
#panel { position: absolute; top: 70px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); width: 330px; border-radius: 16px; display: flex; flex-direction: column; min-height: 0; background: var(--glass-strong); transition: transform .3s ease, opacity .3s; }
#panel.closed { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
.p-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.p-head h1 { font: 600 17px/1.2 var(--f-display); margin: 0; text-wrap: balance; }
.p-head .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.stat { background: var(--chip); border-radius: 9px; padding: 7px 8px; }
.stat b { display: block; font: 600 16px var(--f-display); font-variant-numeric: tabular-nums; }
.stat small { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stat.alert b { color: var(--alert); }
.p-body { overflow-y: auto; padding: 4px 0 20px; flex: 1; min-height: 0; }
.room { border-bottom: 1px solid var(--line); }
.room-h { width: 100%; display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px 6px; background: none; border: 0; color: var(--fg); cursor: pointer; text-align: left; }
.room-h strong { font: 600 13px var(--f-display); }
.room-h span { font: 500 11px var(--f-mono); color: var(--muted); }
.dev { display: flex; align-items: center; gap: 10px; padding: 6px 16px; }
.dev .ic { width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--chip); color: var(--muted); }
.dev .ic svg { width: 15px; height: 15px; }
.dev[data-k="on"] .ic { background: var(--warm-soft); color: var(--warm); }
.dev[data-k="alert"] .ic { background: var(--alert); color: #fff; }
.dev .nm { flex: 1; min-width: 0; }
.dev .nm button { all: unset; cursor: pointer; font-size: 13px; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dev .nm small { display: block; font-size: 11.5px; color: var(--muted); }
.dev[data-k="alert"] .nm small { color: var(--alert); font-weight: 600; }
.sw { position: relative; width: 38px; height: 22px; flex: none; border-radius: 11px; border: 0; background: rgba(255,255,255,.14); cursor: pointer; transition: background .2s; padding: 0; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.sw[aria-checked="true"] { background: var(--warm); }
.sw[aria-checked="true"]::after { transform: translateX(16px); }
.btn-sim { font: 600 11.5px var(--f-body); border: 1px solid var(--line); background: none; color: var(--fg); border-radius: 7px; padding: 5px 9px; cursor: pointer; flex: none; }
.btn-sim:hover { background: var(--chip); }
.section-t { font: 600 10.5px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 16px 16px 6px; }
.auto { margin: 6px 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 12.5px; transition: border-color .3s, background .3s; }
.auto strong { display: block; font-size: 13px; margin-bottom: 2px; }
.auto p { margin: 0; color: var(--muted); line-height: 1.45; }
.auto.fired { border-color: var(--warm); background: var(--warm-soft); }
.log { margin: 4px 16px 0; font: 400 11.5px/1.6 var(--f-mono); color: var(--muted); }

@media (max-width: 820px) {
  #panel { top: auto; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; max-height: 55%; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
  #panel.closed { transform: translateY(calc(100% + 90px)); }
  .coords { display: none; }
  .tab { padding: 8px 10px; font-size: 12.5px; }
  .seg button, .btn { padding: 7px 9px; }
  .seg[data-opt="paredes"] { display: none; }
}
.err { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
</style>

<div id="app">
  <div id="stage">
    <div id="markers"></div>
    <nav class="tabs glass" id="tabs" role="tablist" aria-label="Ambientes"></nav>
    <div class="toolbar">
      <div class="seg glass" data-opt="vista"><button data-v="3d" aria-pressed="true">3D</button><button data-v="planta" aria-pressed="false">Planta</button></div>
      <div class="seg glass" data-opt="hora"><button data-v="noche" aria-pressed="true">Noche</button><button data-v="dia" aria-pressed="false">Día</button></div>
      <div class="seg glass" data-opt="paredes"><button data-v="altas" aria-pressed="true">Paredes</button><button data-v="bajas" aria-pressed="false">Corte</button></div>
      <button class="btn glass" id="devToggle" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Equipos</button>
    </div>
    <div class="coords glass" id="coords"><span>x</span> — <span>z</span> —</div>
  </div>
  <aside id="panel" class="glass closed" aria-label="Equipos">
    <div class="p-head">
      <div>
        <h1 id="title">Mi departamento</h1>
        <div class="sub" id="subtitle"></div>
      </div>
      <div class="stats">
        <div class="stat"><b id="s-luces">0</b><small>Luces</small></div>
        <div class="stat"><b id="s-temp">—</b><small>Temp.</small></div>
        <div class="stat"><b id="s-disp">0</b><small>Equipos</small></div>
        <div class="stat" id="s-alert-box"><b id="s-alert">0</b><small>Alertas</small></div>
      </div>
    </div>
    <div class="p-body" id="list"></div>
  </aside>
</div>

<script src="plano.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const P = window.PLANO;
const stage = document.getElementById("stage");
if (!P) { stage.innerHTML = '<div class="err">No se encontró plano.js. Tiene que estar en la misma carpeta que index.html.</div>'; throw new Error("sin plano"); }

const H = P.alturaParedes ?? 2.6;
const T_EXT = P.espesorExterior ?? 0.2, T_INT = P.espesorInterior ?? 0.1;
const rad = d => (d || 0) * Math.PI / 180;

/* ---------- Renderer, escena, cámara ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const bb = { x0: Infinity, x1: -Infinity, z0: Infinity, z1: -Infinity };
for (const a of P.ambientes) { bb.x0 = Math.min(bb.x0, a.x); bb.x1 = Math.max(bb.x1, a.x + a.ancho); bb.z0 = Math.min(bb.z0, a.z); bb.z1 = Math.max(bb.z1, a.z + a.largo); }
const center = new THREE.Vector3((bb.x0 + bb.x1) / 2, 0, (bb.z0 + bb.z1) / 2);
const span = Math.max(bb.x1 - bb.x0, bb.z1 - bb.z0);

const camera = new THREE.PerspectiveCamera(36, 1, 0.05, 200);
const HOME_OFFSET = new THREE.Vector3(0, span * 1.5, span * 0.72);
camera.position.copy(center).add(HOME_OFFSET);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(center);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.42;
controls.minDistance = 2; controls.maxDistance = span * 3;
controls.screenSpacePanning = true;

/* Post-proceso: brillo suave en lámparas y ventanas */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(512, 512), 0.35, 0.45, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- Texturas procedurales ---------- */
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvasTex(size, draw, metros, h = size) {
  const c = document.createElement("canvas"); c.width = size; c.height = h;
  const g = c.getContext("2d"); draw(g, size, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
  t.userData.metros = metros; return t;
}
function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function grain(g, x, y, w, h, r, alpha) {
  for (let i = 0; i < w * h / 600; i++) {
    g.strokeStyle = `rgba(60,35,15,${alpha * r()})`; g.lineWidth = 0.6 + r();
    const yy = y + r() * h; g.beginPath(); g.moveTo(x, yy);
    g.bezierCurveTo(x + w * .3, yy + (r() - .5) * 3, x + w * .7, yy + (r() - .5) * 3, x + w, yy + (r() - .5) * 2); g.stroke();
  }
}
const TEX = {
  madera: canvasTex(1024, (g, s) => {
    const r = rnd(7), rows = 8, ph = s / rows;
    for (let i = 0; i < rows; i++) {
      let x = -r() * s * .5;
      while (x < s) {
        const L = s * (.35 + r() * .45);
        const h = 30 + r() * 6, l = 62 + r() * 10;
        g.fillStyle = `hsl(${h},${30 + r() * 10}%,${l}%)`; g.fillRect(x, i * ph, L, ph);
        grain(g, x, i * ph, L, ph, r, .1);
        g.fillStyle = "rgba(60,35,15,.35)"; g.fillRect(x, i * ph, 2, ph);
        if (x + L > s) { g.fillStyle = `hsl(${h},34%,${l}%)`; g.fillRect(x - s, i * ph, L, ph); grain(g, x - s, i * ph, L, ph, r, .1); }
        x += L;
      }
      g.fillStyle = "rgba(60,35,15,.3)"; g.fillRect(0, i * ph, s, 1.5);
    }
  }, 1.6),
  deck: canvasTex(512, (g, s) => {
    const r = rnd(3), n = 6, w = s / n;
    for (let i = 0; i < n; i++) { g.fillStyle = `hsl(26,${24 + r() * 8}%,${42 + r() * 6}%)`; g.fillRect(i * w, 0, w, s); grain(g, i * w, 0, w, s, r, .16); g.fillStyle = "#2a1b10"; g.fillRect(i * w, 0, 4, s); }
  }, 0.9),
  porcelanato: canvasTex(512, (g, s) => {
    const r = rnd(11), n = 2, w = s / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      g.fillStyle = `hsl(40,6%,${88 + r() * 4}%)`; g.fillRect(i * w, j * w, w, w);
      for (let k = 0; k < 900; k++) { g.fillStyle = `rgba(120,110,100,${r() * .05})`; g.fillRect(i * w + r() * w, j * w + r() * w, 2 + r() * 6, 1 + r() * 3); }
    }
    g.fillStyle = "#c4bfb6"; for (let i = 0; i <= n; i++) { g.fillRect(i * w - 1.5, 0, 3, s); g.fillRect(0, i * w - 1.5, s, 3); }
  }, 1.2),
  ceramica: canvasTex(512, (g, s) => {
    const r = rnd(5), n = 4, w = s / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { g.fillStyle = `hsl(200,8%,${88 + r() * 5}%)`; g.fillRect(i * w, j * w, w, w); }
    g.fillStyle = "#a9b3b8"; for (let i = 0; i <= n; i++) { g.fillRect(i * w - 2, 0, 4, s); g.fillRect(0, i * w - 2, s, 4); }
  }, 1.2),
  tela: canvasTex(256, (g, s) => {
    const r = rnd(9); g.fillStyle = "#fff"; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 5000; i++) { g.fillStyle = `rgba(0,0,0,${r() * .07})`; g.fillRect(r() * s, r() * s, 1, 2); }
  }, 0.3),
};
const FLOOR_ROUGH = { madera: .45, deck: .8, porcelanato: .2, ceramica: .3 };

// Fondos de pantalla (degradé radial azul de noche / gris claro de día)
function bgTex(inner, outer) {
  return canvasTex(512, (g, s) => {
    const gr = g.createRadialGradient(s / 2, s * .45, s * .05, s / 2, s / 2, s * .75);
    gr.addColorStop(0, inner); gr.addColorStop(1, outer); g.fillStyle = gr; g.fillRect(0, 0, s, s);
  }, 1);
}
const BG = { noche: bgTex("#2552b0", "#081230"), dia: bgTex("#f4f6f9", "#c7d0dd") };

/* ---------- Materiales ---------- */
const M = {
  pared: new THREE.MeshStandardMaterial({ color: 0xf4f3f0, roughness: .9 }),
  corte: new THREE.MeshStandardMaterial({ color: 0x14244c, roughness: .7 }),
  losa: new THREE.MeshStandardMaterial({ color: 0x14244c, roughness: .8 }),
  suelo: new THREE.MeshStandardMaterial({ color: 0xc9cdc6, roughness: 1 }),
  alu: new THREE.MeshStandardMaterial({ color: 0x4a5566, roughness: .35, metalness: .7 }),
  vidrio: new THREE.MeshPhysicalMaterial({ color: 0xbfe0ff, emissive: 0x3d8cff, emissiveIntensity: 0, roughness: .05, transparent: true, opacity: .35, envMapIntensity: 1.4, depthWrite: false }),
  maderaClara: new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: .55 }),
  maderaOscura: new THREE.MeshStandardMaterial({ color: 0x7a5638, roughness: .5 }),
  puerta: new THREE.MeshStandardMaterial({ color: 0xd9b98f, roughness: .5 }),
  blanco: new THREE.MeshStandardMaterial({ color: 0xf6f6f3, roughness: .35 }),
  ceramicaS: new THREE.MeshPhysicalMaterial({ color: 0xfafafa, roughness: .12, clearcoat: .8 }),
  tela: new THREE.MeshStandardMaterial({ color: 0x8d9aa6, roughness: .95, map: TEX.tela }),
  telaClara: new THREE.MeshStandardMaterial({ color: 0xf0ece4, roughness: .95, map: TEX.tela }),
  manta: new THREE.MeshStandardMaterial({ color: 0xb4483e, roughness: .95, map: TEX.tela }),
  manta2: new THREE.MeshStandardMaterial({ color: 0x5d7f6a, roughness: .95, map: TEX.tela }),
  alfombra: new THREE.MeshStandardMaterial({ color: 0xe0b44a, roughness: 1, map: TEX.tela }),
  negro: new THREE.MeshStandardMaterial({ color: 0x1b1d22, roughness: .3, metalness: .2 }),
  acero: new THREE.MeshStandardMaterial({ color: 0xc4c8cb, roughness: .28, metalness: .85 }),
  piedra: new THREE.MeshStandardMaterial({ color: 0x33363b, roughness: .3 }),
  maceta: new THREE.MeshStandardMaterial({ color: 0xd8d4cc, roughness: .6 }),
  hoja: new THREE.MeshStandardMaterial({ color: 0x4f8a45, roughness: .8 }),
  espejo: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0, metalness: 1 }),
  persiana: new THREE.MeshStandardMaterial({ color: 0xd8d6d0, roughness: .6 }),
  disp: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .4 }),
};

/* ---------- Helpers de geometría (cajas con bordes suavizados) ---------- */

/* ---------- Dispositivos ---------- */
const SENSORES = new Set(["sensor_movimiento", "sensor_apertura", "humo", "agua"]);
const CONTROLABLES = new Set(["luz", "enchufe", "persiana", "aire", "cerradura", "camara"]);
const devGroup = new THREE.Group(); world.add(devGroup);
const devs = [];
const DEV = Object.create(null);
let lowWalls = false;
const WARM = 0xffb562;

function makeDevice(d) {
  const dev = { cfg: d, on: d.tipo === "persiana" ? d.abierta !== false : !!d.encendido, pos: new THREE.Vector3(), lerp: 0, level: 0 };
  if (d.tipo === "cerradura") dev.on = d.bloqueada !== false;
  if (d.tipo === "camara") dev.on = d.encendido !== false;
  if (d.tipo === "clima") dev.val = { t: d.temperatura ?? 22 + Math.random() * 2, h: d.humedad ?? 45 + Math.random() * 15 };
  const g = new THREE.Group(); devGroup.add(g);
  if (d.pos) dev.pos.set(d.pos[0], d.pos[1] ?? H, d.pos[2]);
  g.position.copy(dev.pos); g.rotation.y = rad(d.rot);

  switch (d.tipo) {
    case "luz": {
      const estilo = d.estilo || "techo";
      dev.bulbMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffc27a, emissiveIntensity: 0, roughness: .3 });
      let ly;
      if (estilo === "colgante") {
        g.position.y = H; cyl(g, 0.005, 0.005, 0.8, M.negro, 0, -0.4, 0, 6);
        const shade = cyl(g, 0.07, 0.24, 0.22, M.negro, 0, -0.9, 0); shade.material = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: .5, side: THREE.DoubleSide });
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), dev.bulbMat); b.position.y = -0.98; g.add(b);
        ly = H - 1.05; dev.pos.y = H - 0.9;
      } else if (estilo === "aplique") {
        box(g, 0.12, 0.2, 0.08, dev.bulbMat, 0, 0, 0.04).castShadow = false;
        ly = dev.pos.y;
      } else {
        g.position.y = H; cyl(g, 0.2, 0.2, 0.04, dev.bulbMat, 0, -0.02, 0, 32).castShadow = false;
        ly = H - 0.35; dev.pos.y = H - 0.04;
      }
      const amb = P.ambientes.find(a => a.id === d.ambiente);
      const L = new THREE.PointLight(WARM, 0, amb ? Math.hypot(amb.ancho, amb.largo) * 0.8 + 0.5 : 5, 2);
      L.position.set(dev.pos.x, ly, dev.pos.z + (estilo === "aplique" ? 0.25 : 0)); scene.add(L);
      dev.light = L; dev.power = d.intensidad ?? (estilo === "colgante" ? 9 : estilo === "aplique" ? 5 : 14);
      break;
    }
    case "persiana": {
      const o = OPEN[d.abertura]; if (!o) { console.warn("Persiana sin abertura:", d); break; }
      const w = o.s1 - o.s0, h = o.y1 - o.y0;
      const off = -(o.wi.t / 2 + 0.03) * (d.lado ?? 1);
      const gg = oriented(o.wi, (o.s0 + o.s1) / 2, off); devGroup.add(gg); g.removeFromParent();
      box(gg, w + 0.1, 0.18, 0.18, M.persiana, 0, o.y1 + 0.09, 0);
      const slat = new THREE.Group(); slat.position.y = o.y1; gg.add(slat);
      dev.slat = box(slat, w, 1, 0.025, new THREE.MeshStandardMaterial({ color: 0xcfcbc2, roughness: .6, map: slatTex() }), 0, -0.5, 0);
      dev.slatH = h; dev.lerp = dev.on ? 0 : 1; dev.group = gg;
      dev.pos.copy(o.center).add(new THREE.Vector3(o.wi.n.x * off, 0, o.wi.n.y * off)); dev.pos.y = o.y1 - 0.1;

    case "aire":

      dev.led = box(g, 0.03, 0.015, 0.01, new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x4cc3ff, emissiveIntensity: 0 }), 0.33, 0.06, 0.205);
      break;
    case "enchufe": box(g, 0.08, 0.08, 0.025, M.disp, 0, 0, 0.012);
      dev.led = box(g, 0.012, 0.012, 0.005, new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x6dff9a, emissiveIntensity: 0 }), 0.025, 0.025, 0.026); break;
    case "cerradura": box(g, 0.07, 0.18, 0.04, M.negro, 0, 0, 0.02); break;
    case "camara": box(g, 0.06, 0.06, 0.1, M.disp, 0, 0, 0); cyl(g, 0.02, 0.02, 0.01, M.negro, 0, 0, 0.055).rotation.x = Math.PI / 2; break;
    case "humo": cyl(g, 0.06, 0.06, 0.035, M.disp, 0, 0, 0); break;
    case "agua": box(g, 0.07, 0.025, 0.07, M.disp, 0, 0, 0); break;
    case "hub": box(g, 0.22, 0.04, 0.15, M.negro, 0, 0.02, 0); for (const x of [-.08, .08]) box(g, 0.01, 0.12, 0.01, M.negro, x, 0.1, -0.06); break;

function slatTex() {
  return canvasTex(128, (g, s) => { g.fillStyle = "#fff"; g.fillRect(0, 0, s, s); for (let i = 0; i < s; i += 8) { g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(0, i, s, 1.5); g.fillStyle = "rgba(255,255,255,.6)"; g.fillRect(0, i + 2, s, 1); } }, 1);
}
(P.dispositivos || []).forEach(makeDevice);
const lucesDe = id => devs.filter(d => d.cfg.tipo === "luz" && d.cfg.ambiente === id);

/* ---------- Estado y lógica ---------- */
function estadoTexto(dev) {
  switch (dev.cfg.tipo) {
    case "luz": case "enchufe": return dev.on ? "Encendido" : "Apagado";
    case "persiana": return dev.on ? "Abierta" : "Cerrada";
    case "aire": return dev.on ? `Frío · ${dev.cfg.temperatura ?? 24} °C` : "Apagado";
    case "cerradura": return dev.on ? "Con llave" : "Sin llave";
    case "camara": return dev.on ? "Grabando" : "Pausada";
    case "sensor_movimiento": return dev.alert ? "Movimiento detectado" : "Sin movimiento";
    case "sensor_apertura": return dev.alert ? "Abierta" : "Cerrada";
    case "humo": return dev.alert ? "¡Humo detectado!" : "Normal";
    case "agua": return dev.alert ? "¡Pérdida de agua!" : "Seco";
    case "clima": return `${dev.val.t.toFixed(1)} °C · ${Math.round(dev.val.h)} % HR`;
    case "hub": return "En línea";
    case "parlante": return "En espera";
  }
  return "";
}
function kind(dev) {
  const t = dev.cfg.tipo;
  if (SENSORES.has(t)) return dev.alert ? (t === "humo" || t === "agua" ? "alert" : "on") : "sensor";
  if (t === "clima" || t === "hub" || t === "parlante") return "ok";
  return dev.on ? "on" : "off";
}
function apply(dev) {
  const t = dev.cfg.tipo;
  if (t === "aire" || t === "enchufe") dev.led.material.emissiveIntensity = dev.on ? 3 : 0;
  const k = kind(dev);
  dev.el.dataset.k = k;
  dev.tip.textContent = `${dev.cfg.nombre} · ${estadoTexto(dev)}`;
  dev.el.setAttribute("aria-label", dev.tip.textContent);
  const row = document.querySelector(`.dev[data-id="${dev.cfg.id}"]`);
  if (row) {
    row.dataset.k = k; row.querySelector("small").textContent = estadoTexto(dev);
    const sw = row.querySelector(".sw"); if (sw) sw.setAttribute("aria-checked", dev.on);
  }
  if (t === "luz") refreshRoom(dev.cfg.ambiente);
  updateStats();
}
function setOn(dev, v) { dev.on = v; apply(dev); }
function log(msg) {
  const el = document.getElementById("log"); if (!el) return;
  const hh = new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  el.innerHTML = `<div>${hh} ${msg}</div>` + el.innerHTML.split("</div>").slice(0, 5).join("</div>");
}
function trigger(dev) {
  dev.alert = true; apply(dev);
  log(`${dev.cfg.nombre}: ${estadoTexto(dev).toLowerCase()}`);
  (P.automatizaciones || []).forEach((a, i) => {
    if (a.si.dispositivo !== dev.cfg.id) return;
    for (const acc of a.entonces) { const d2 = DEV[acc.dispositivo]; if (d2) setOn(d2, !!acc.encender); }
    const card = document.querySelector(`.auto[data-i="${i}"]`);
    if (card) { card.classList.add("fired"); setTimeout(() => card.classList.remove("fired"), 2500); }
    log(`Automatización: ${a.nombre}`);
  });
  clearTimeout(dev.timer);
  dev.timer = setTimeout(() => { dev.alert = false; apply(dev); }, dev.cfg.tipo === "sensor_movimiento" ? 6000 : 9000);
}
function act(dev) {
  const t = dev.cfg.tipo;
  if (CONTROLABLES.has(t)) { setOn(dev, !dev.on); log(`${dev.cfg.nombre}: ${estadoTexto(dev).toLowerCase()}`); }
  else if (SENSORES.has(t)) trigger(dev);
  else focus(dev.pos, 3);
}
function toggleRoom(id) {
  const ls = lucesDe(id); if (!ls.length) return;
  const v = !ls.some(d => d.on);
  ls.forEach(d => setOn(d, v));
  log(`${P.ambientes.find(a => a.id === id).nombre}: luces ${v ? "encendidas" : "apagadas"}`);
}
function updateStats() {
  const luces = devs.filter(d => d.cfg.tipo === "luz");
  document.getElementById("s-luces").textContent = `${luces.filter(d => d.on).length}/${luces.length}`;
  document.getElementById("s-disp").textContent = devs.length;
  const al = devs.filter(d => d.alert && (d.cfg.tipo === "humo" || d.cfg.tipo === "agua")).length;
  document.getElementById("s-alert").textContent = al;
  document.getElementById("s-alert-box").classList.toggle("alert", al > 0);
  const cl = devs.filter(d => d.cfg.tipo === "clima");
  document.getElementById("s-temp").textContent = cl.length ? (cl.reduce((s, d) => s + d.val.t, 0) / cl.length).toFixed(1) + "°" : "—";
}

/* ---------- Pestañas y botones de ambiente ---------- */
const tabsEl = document.getElementById("tabs");
const ROOM_UI = {};
tabsEl.innerHTML = `<button class="tab" role="tab" aria-selected="true" data-room="">${svg("general")}Vista general</button>` +

tabsEl.addEventListener("click", e => {

for (const a of P.ambientes) {
  const el = document.createElement("div");
  el.className = "room-btn";
  const has = lucesDe(a.id).length > 0;

/* ---------- Panel de equipos ---------- */
function buildPanel() {
  document.getElementById("title").textContent = P.nombre || "Mi departamento";
  const area = P.ambientes.filter(a => !a.exterior).reduce((s, a) => s + a.ancho * a.largo, 0);
  document.getElementById("subtitle").textContent = `${P.ambientes.length} ambientes · ${area.toFixed(1)} m² cubiertos · plano de ejemplo`;
  let html = "";
  for (const a of P.ambientes) {
    html += `<div class="room"><button class="room-h" data-room="${a.id}"><strong>${a.nombre}</strong><span>${a.ancho.toFixed(2)} × ${a.largo.toFixed(2)} m</span></button>`;
    for (const d of devs.filter(d => d.cfg.ambiente === a.id)) {
      const t = d.cfg.tipo;
      const ctl = CONTROLABLES.has(t) ? `<button class="sw" role="switch" aria-checked="${d.on}" aria-label="${d.cfg.nombre}"></button>`
        : SENSORES.has(t) ? `<button class="btn-sim">Simular</button>` : "";
      html += `<div class="dev" data-id="${d.cfg.id}"><div class="ic">${svg(t)}</div><div class="nm"><button>${d.cfg.nombre}</button><small></small></div>${ctl}</div>`;
    }
    html += `</div>`;
  }
  const autos = P.automatizaciones || [];
  if (autos.length) {
    html += `<div class="section-t">Automatizaciones</div>`;
    autos.forEach((a, i) => {
      const s = DEV[a.si.dispositivo]?.cfg.nombre ?? a.si.dispositivo;
      const acc = a.entonces.map(e => `${e.encender ? "activar" : "desactivar"} ${(DEV[e.dispositivo]?.cfg.nombre ?? e.dispositivo).toLowerCase()}`).join(", ");
      html += `<div class="auto" data-i="${i}"><strong>${a.nombre}</strong><p>Si ${s.toLowerCase()} se activa → ${acc}.</p></div>`;
    });
  }
  html += `<div class="section-t">Actividad</div><div class="log" id="log"><div>Tocá un ambiente para prender o apagar sus luces.</div></div>`;
  const list = document.getElementById("list");
  list.innerHTML = html;
  list.addEventListener("click", e => {
    const room = e.target.closest(".room-h");
    if (room) { const a = P.ambientes.find(x => x.id === room.dataset.room); selectTab(a.id); focusRoom(a); return; }
    const row = e.target.closest(".dev"); if (!row) return;
    const dev = DEV[row.dataset.id];
    if (e.target.closest(".sw") || e.target.closest(".btn-sim")) act(dev);
    else if (e.target.closest(".nm button")) focus(dev.pos, 3.2);
  });

}
buildPanel();
const panel = document.getElementById("panel"), devToggle = document.getElementById("devToggle");
devToggle.addEventListener("click", () => {

/* ---------- Cámara ---------- */
let anim = null, planta = false;
function flyTo(toT, toP) { anim = { t: 0, fromT: controls.target.clone(), toT, fromP: camera.position.clone(), toP }; }
function focus(target, dist) {
  const dir = camera.position.clone().sub(controls.target).normalize();
  if (planta) dir.set(0, 1, 0.0001);
  const t = new THREE.Vector3(target.x, 0, target.z);
  flyTo(t, t.clone().add(dir.multiplyScalar(dist)));
}
function focusRoom(a) {
  const t = new THREE.Vector3(a.x + a.ancho / 2, 0, a.z + a.largo / 2);
  const d = (Math.max(a.ancho, a.largo) * 1.5 + 2.2) * fit();
  const dir = planta ? new THREE.Vector3(0, 1, 0.0001) : HOME_OFFSET.clone().normalize();
  flyTo(t, t.clone().add(dir.multiplyScalar(d)));
}
// En pantallas angostas (celular) la cámara se aleja para que entre todo el ancho
const fit = () => Math.max(1, 1.32 / camera.aspect);
const homeOffset = () => HOME_OFFSET.clone().multiplyScalar(fit());
function goHome() {
  flyTo(center.clone(), planta ? center.clone().add(new THREE.Vector3(0, span * 1.6 * fit(), 0.001)) : center.clone().add(homeOffset()));
}

/* ---------- Opciones de vista ---------- */
let noche = true;
const opts = {
  vista(v) {
    planta = v === "planta";
    controls.maxPolarAngle = planta ? 0.001 : Math.PI * 0.42;
    if (planta) { setSeg("paredes", "bajas"); opts.paredes("bajas"); }
    selectTab(""); goHome();
  },
  hora(v) {
    noche = v === "noche";
    sun.intensity = noche ? 0.55 : 3.2;
    sun.color.set(noche ? 0xa9c6ff : 0xfff1dc);
    sun.position.set(center.x + (noche ? 3 : -7), 12, center.z + (noche ? 4 : -9));
    hemi.color.set(noche ? 0x9dbcff : 0xdfe9f3);
    hemi.groundColor.set(noche ? 0x22345f : 0x8a7f70);
    hemi.intensity = noche ? 0.6 : 0.9;
    scene.environmentIntensity = noche ? 0.14 : 0.55;
    scene.background = noche ? BG.noche : BG.dia;
    suelo.visible = !noche;
    M.vidrio.emissiveIntensity = noche ? 0.9 : 0;
    renderer.toneMappingExposure = noche ? 1.05 : 1.0;
    bloom.strength = noche ? 0.35 : 0.1;

  paredes(v) {

    renderer.clippingPlanes = lowWalls ? [new THREE.Plane(new THREE.Vector3(0, -1, 0), 1.1)] : [];
    devs.forEach(d => { if (d.group) d.group.visible = !lowWalls; });
  },
};
function setSeg(name, v) { document.querySelectorAll(`.seg[data-opt="${name}"] button`).forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); }
document.querySelectorAll(".seg").forEach(seg => seg.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  setSeg(seg.dataset.opt, b.dataset.v); opts[seg.dataset.opt](b.dataset.v);

/* ---------- Puntero: coordenadas y toque sobre un ambiente ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const coordsEl = document.getElementById("coords");
function floorHit(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(floors, false)[0];
}
renderer.domElement.addEventListener("pointermove", e => {
  const hit = floorHit(e);
  coordsEl.innerHTML = hit
    ? `<span>x</span> ${hit.point.x.toFixed(2)} <span>z</span> ${hit.point.z.toFixed(2)} m <span>·</span> ${hit.object.userData.ambiente.nombre}`
    : `<span>x</span> — <span>z</span> —`;
});
let down = null;
renderer.domElement.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) return;
  const hit = floorHit(e); if (hit) toggleRoom(hit.object.userData.ambiente.id);
});

/* ---------- Bucle ---------- */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h); composer.setPixelRatio(renderer.getPixelRatio());
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
const v = new THREE.Vector3();
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (anim) {
    anim.t = Math.min(1, anim.t + dt / (reduced ? 0.01 : 0.9)); const k = ease(anim.t);
    controls.target.lerpVectors(anim.fromT, anim.toT, k); camera.position.lerpVectors(anim.fromP, anim.toP, k);
    if (anim.t >= 1) anim = null;
  }
  controls.update();
  for (const d of devs) {
    if (d.light) {   // encendido / apagado con fundido
      d.level += ((d.on ? 1 : 0) - d.level) * Math.min(1, dt * (reduced ? 60 : 6));
      d.light.intensity = d.power * d.level; d.bulbMat.emissiveIntensity = 3 * d.level;
    }
    if (d.slat) {
      const goal = d.on ? 0.04 : 1; d.lerp += (goal - d.lerp) * Math.min(1, dt * 3);
      const h = Math.max(0.02, d.slatH * d.lerp); d.slat.scale.y = h; d.slat.position.y = -h / 2;
    }
    if (d.cfg.tipo === "clima" && Math.random() < dt * 0.2) { d.val.t += (Math.random() - .5) * 0.1; apply(d); }
  }
  for (const f of floors) {  // brillo del piso según las luces del ambiente
    const ls = lucesDe(f.userData.ambiente.id);
    const lv = ls.length ? Math.max(...ls.map(d => d.level)) : 0;
    f.material.emissiveIntensity = lv * (noche ? 0.42 : 0.12);
  }
  composer.render();
  const w = stage.clientWidth, h = stage.clientHeight;
  const place = (el, p, extra = "") => {
    v.copy(p).project(camera);
    if (v.z > 1 || Math.abs(v.x) > 1.1 || Math.abs(v.y) > 1.1) { el.style.visibility = "hidden"; return; }
    el.style.visibility = "";
    el.style.transform = `translate(${((v.x + 1) / 2 * w).toFixed(1)}px, ${((1 - v.y) / 2 * h).toFixed(1)}px)${extra}`;
  };
  for (const d of devs) { if (d.slat && lowWalls) { d.el.style.visibility = "hidden"; continue; } place(d.el, d.pos); }
  for (const id in ROOM_UI) place(ROOM_UI[id].el, ROOM_UI[id].pos, " translateX(-50%)");
});
opts.hora("noche");
buildWalls(H);
resize();
camera.position.copy(center).add(homeOffset());
// Estado inicial: living encendido, como en un dashboard en uso
lucesDe("living").forEach(d => { d.on = true; d.level = 1; apply(d); });
</script>
